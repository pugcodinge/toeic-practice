<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校內多益考古題練習</title>
<style>
:root{
  --bg:#f6f5f1; --card:#fff; --ink:#1d1f23; --muted:#6b6f76; --line:#e3e1da;
  --accent:#2f5d8a; --accent-soft:#e6eef6; --ok:#2e7d4f; --ok-soft:#e5f3ea;
  --bad:#b3402f; --bad-soft:#fbe9e6; --zh:#7a5a1e; --zh-soft:#fbf4e4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --card:#1f2226; --ink:#e7e7e4; --muted:#9a9ea5; --line:#33373d;
    --accent:#7fb0e0; --accent-soft:#22303d; --ok:#6cc895; --ok-soft:#1d3127;
    --bad:#f08a78; --bad-soft:#3a2420; --zh:#e3c27d; --zh-soft:#2e281b;
  }
}
:root[data-theme="dark"]{
  --bg:#16181b; --card:#1f2226; --ink:#e7e7e4; --muted:#9a9ea5; --line:#33373d;
  --accent:#7fb0e0; --accent-soft:#22303d; --ok:#6cc895; --ok-soft:#1d3127;
  --bad:#f08a78; --bad-soft:#3a2420; --zh:#e3c27d; --zh-soft:#2e281b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
header.top h1{font-size:18px;margin:0;cursor:pointer}
nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#111}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#111}}
.btn.on{background:var(--zh-soft);border-color:var(--zh);color:var(--zh)}
.btn.small{padding:2px 8px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.muted{color:var(--muted)}
h2{font-size:20px;margin:8px 0 12px}
h3{font-size:16px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.setrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}
.setrow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:12px;border-radius:999px;padding:1px 8px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
details.part>summary{cursor:pointer;font-weight:600;padding:6px 0}
/* quiz */
.qset{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px;align-items:start}
.qset.single{grid-template-columns:1fr}
.passage{position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto;font-size:15px}
.passage table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}
.passage td,.passage th{border:1px solid var(--line);padding:3px 6px;text-align:left}
.passage .blank{background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:4px;padding:0 3px}
.zhbox{background:var(--zh-soft);color:var(--zh);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:15px}
.q{padding:12px 0;border-top:1px dashed var(--line)}
.q:first-child{border-top:0;padding-top:0}
.qhead{display:flex;gap:8px;align-items:baseline}
.qnum{font-weight:700;color:var(--accent);white-space:nowrap}
.qtext{flex:1;white-space:pre-line}
.opts{display:grid;gap:6px;margin-top:8px}
.opt{display:flex;gap:8px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 10px;width:100%}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.opt .L{font-weight:700;min-width:24px}
.opt .oz{display:block;font-size:13px;color:var(--zh)}
.ex{margin-top:8px;border-left:3px solid var(--accent);padding:6px 10px;background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:15px}
.bar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 0;z-index:15}
.bar .wrap{display:flex;gap:10px;align-items:center;padding-top:0;padding-bottom:0;flex-wrap:wrap}
.score{font-size:40px;font-weight:800}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.dot{width:30px;height:26px;border-radius:6px;font-size:12px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);cursor:pointer;background:var(--card);color:var(--ink)}
.dot.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.dot.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.dot.ans{background:var(--accent-soft);border-color:var(--accent)}
.tag{font-size:12px;color:var(--muted)}
@media (max-width:820px){
  .qset{grid-template-columns:1fr}
  .passage{position:static;max-height:none}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1 onclick="go('home')">📘 校內多益考古題</h1>
  <nav>
    <button class="btn" onclick="go('home')">練習</button>
    <button class="btn" onclick="go('review')">複習</button>
    <button class="btn" id="zhTop" onclick="toggleAllZh()">中文：關</button>
    <button class="btn" onclick="go('history')">紀錄</button>
    <button class="btn" id="themeBtn" onclick="toggleTheme()">🌓</button>
  </nav>
</div></header>
<main class="wrap" id="app"></main>
<div id="barHost"></div>

<script src="data/t1.js"></script>
<script src="data/t2.js"></script>
<script src="data/t3.js"></script>
<script src="data/t4.js"></script>
<script>
const TESTS_ = (window.TESTS||[]).sort((a,b)=>a.id-b.id);
const L = ['A','B','C','D'];
const $app = document.getElementById('app'), $bar = document.getElementById('barHost');

/* ---------- storage ---------- */
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let HIST  = load('toeic_hist',[]);      // [{label,score,total,time,keys}]
let BEST  = load('toeic_best',{});      // setKey -> {c,t}

/* ---------- lookup ---------- */
const QMAP = {};  // "t-n" -> {test,set,q,si}
TESTS_.forEach(t=>t.sets.forEach((s,si)=>s.qs.forEach(q=>{QMAP[t.id+'-'+q.n]={test:t,set:s,si,q}})));
const qkey = (t,n)=>t+'-'+n;

/* ---------- theme ---------- */
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const nxt = dark?'light':'dark';
  document.documentElement.setAttribute('data-theme',nxt); save('toeic_theme',nxt);
}
(()=>{const t=load('toeic_theme',null); if(t) document.documentElement.setAttribute('data-theme',t)})();

/* ---------- state ---------- */
let S = null;  // current quiz {label, keys:[...], groups:[{test,si,qns:[]}], ans:{}, done, mode, zh, start}
function go(view, arg){
  $bar.innerHTML=''; window.scrollTo(0,0);
  if(view==='home') renderHome();
  else if(view==='review') renderReview();
  else if(view==='history') renderHistory();
}

/* ---------- home ---------- */
const PART_NAME={5:'Part 5 單句填空',6:'Part 6 段落填空',7:'Part 7 閱讀測驗'};
function bestBadge(key){
  const b=BEST[key]; if(!b) return '<span class="badge">未練習</span>';
  const pct=Math.round(b.c/b.t*100);
  return `<span class="badge ${pct===100?'ok':pct<70?'bad':''}">最佳 ${b.c}/${b.t}</span>`;
}
function renderHome(){
  if(!TESTS_.length){$app.innerHTML='<p>找不到題目資料。</p>';return}
  const total=Object.keys(QMAP).length;
  let h=`<h2>選一份考古題開始練習</h2>
  <p class="muted">共 ${TESTS_.length} 份、${total} 題。可以分 Part、分篇練習，也可以整份模擬考。</p>
  <div class="grid">`;
  TESTS_.forEach(t=>{
    const n=t.sets.reduce((a,s)=>a+s.qs.length,0);
    h+=`<div class="card"><h3>${t.name} <span class="tag">${n} 題</span></h3>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
        <button class="btn primary" onclick="startTest(${t.id},'all')">整份模擬考</button>
        <button class="btn" onclick="startTest(${t.id},5)">Part 5</button>
        <button class="btn" onclick="startTest(${t.id},6)">Part 6</button>
        <button class="btn" onclick="startTest(${t.id},7)">Part 7</button>
      </div>
      <div class="setrow"><span class="t muted">整份</span>${bestBadge(t.id+':all')}</div>`;
    [5,6,7].forEach(p=>{
      const sets=t.sets.map((s,si)=>[s,si]).filter(([s])=>s.part===p);
      h+=`<details class="part"><summary>${PART_NAME[p]}（逐篇）</summary>`;
      sets.forEach(([s,si])=>{
        const r=s.qs[0].n+(s.qs.length>1?'–'+s.qs[s.qs.length-1].n:'');
        const title=p===5?'全部 30 題':s.title.replace(/^Part \d｜/,'');
        h+=`<div class="setrow"><span class="tag">Q${r}</span><span class="t" title="${esc(s.title)}">${esc(title)}</span>${bestBadge(t.id+':'+si)}<button class="btn small" onclick="startSet(${t.id},${si})">練習</button></div>`;
        if(p===5) for(let i=0;i<s.qs.length;i+=10){
          const a=s.qs[i].n, b=s.qs[Math.min(i+9,s.qs.length-1)].n;
          h+=`<div class="setrow"><span class="tag">Q${a}–${b}</span><span class="t muted">分段練習</span>${bestBadge(t.id+':'+si+':'+a)}<button class="btn small" onclick="startRange(${t.id},${si},${a},${b})">練習</button></div>`;
        }
      });
      h+='</details>';
    });
    h+='</div>';
  });
  h+='</div>';
  $app.innerHTML=h;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ---------- start quizzes ---------- */
function T(id){return TESTS_.find(t=>t.id===id)}
function startTest(id,part){
  const t=T(id);
  const groups=t.sets.map((s,si)=>({test:t,si,qns:s.qs.map(q=>q.n)})).filter(g=>part==='all'||g.test.sets[g.si].part===part);
  begin(`${t.name}｜${part==='all'?'整份模擬考':PART_NAME[part]}`, groups, 'exam', part==='all'?id+':all':null);
}
function startSet(id,si){
  const t=T(id), s=t.sets[si];
  begin(`${t.name}｜${s.title}`, [{test:t,si,qns:s.qs.map(q=>q.n)}], 'exam', id+':'+si);
}
function startRange(id,si,a,b){
  const t=T(id);
  begin(`${t.name}｜Part 5 Q${a}–${b}`, [{test:t,si,qns:t.sets[si].qs.map(q=>q.n).filter(n=>n>=a&&n<=b)}], 'exam', id+':'+si+':'+a);
}
function startKeys(label, keys, mode){
  // group consecutive keys by test+set, preserving order
  const groups=[];
  keys.forEach(k=>{
    const m=QMAP[k]; if(!m) return;
    const g=groups.find(g=>g.test===m.test&&g.si===m.si);
    if(g) g.qns.push(m.q.n); else groups.push({test:m.test,si:m.si,qns:[m.q.n]});
  });
  groups.forEach(g=>g.qns.sort((a,b)=>a-b));
  begin(label, groups, mode, null);
}
function begin(label, groups, mode, bestKey){
  S={label,groups,mode,bestKey,ans:{},done:false,zh:ZH,start:Date.now()};
  renderQuiz();
}

/* ---------- quiz render ---------- */
function allKeys(){const k=[];S.groups.forEach(g=>g.qns.forEach(n=>k.push(qkey(g.test.id,n))));return k}
function renderQuiz(){
  const keys=allKeys();
  let h=`<h2>${esc(S.label)}</h2>`;
  if(S.mode==='browse') h+=`<p class="muted">瀏覽模式：直接顯示答案與解析，適合考前快速複習。</p>`;
  if(S.done) h+=resultSummary();
  S.groups.forEach((g,gi)=>{
    const s=g.test.sets[g.si];
    const hasP=!!s.passage;
    h+=`<div class="qset ${hasP?'':'single'}" id="g${gi}">`;
    if(hasP){
      let p=s.passage.replace(/__\((\d+)\)__/g,'<span class="blank">($1)</span>');
      h+=`<div class="card passage"><div class="tag">${esc(g.test.name)}｜${esc(s.title)}</div>${p}
        <div class="zhbox" style="display:${S.zh?'block':'none'}">${s.pz||''}</div></div>`;
    }
    h+='<div class="card">';
    if(!hasP) h+=`<div class="tag" style="margin-bottom:8px">${esc(g.test.name)}｜${esc(s.title)}</div>`;
    g.qns.forEach(n=>{ h+=renderQ(g.test,s.qs.find(q=>q.n===n)); });
    h+='</div></div>';
  });
  $app.innerHTML=h;
  renderBar();
}
function renderQ(t,q){
  const k=qkey(t.id,q.n), my=S.ans[k], show=S.done||S.mode==='browse';
  const wrong=show&&S.mode!=='browse'&&my!==q.a;
  let h=`<div class="q" id="q${k}"><div class="qhead"><span class="qnum">${q.n}.</span><span class="qtext">${q.qz||!/^Question \d+$/.test(q.q)?esc(q.q):'<span class="muted">（請看左側文章第 '+q.n+' 題空格）</span>'}</span></div>`;
  if(q.qz) h+=`<div class="zhbox qz" style="display:${S.zh?'block':'none'}">${esc(q.qz)}</div>`;
  h+='<div class="opts">';
  q.o.forEach((o,i)=>{
    let cls='';
    if(show){ if(i===q.a) cls='right'; else if(i===my) cls='wrong'; }
    else if(i===my) cls='sel';
    h+=`<button class="opt ${cls}" ${show?'disabled':''} onclick="pick('${k}',${i})"><span class="L">(${L[i]})</span><span>${esc(o)}${q.oz?`<span class="oz" style="display:${S.zh?'block':'none'}">${esc(q.oz[i])}</span>`:''}</span></button>`;
  });
  h+='</div>';
  if(show){
    if(S.mode!=='browse') h+=`<div class="tag" style="margin-top:6px">${my===undefined?'<b style="color:var(--bad)">未作答</b>':my===q.a?'<b style="color:var(--ok)">✓ 答對</b>':`<b style="color:var(--bad)">✗ 你選 (${L[my]})</b>`}　正解 (${L[q.a]})</div>`;
    h+=`<div class="ex"><b>解析：</b>${esc(q.ex)}</div>`;
  }
  return h+'</div>';
}
function pick(k,i){
  if(S.done) return;
  S.ans[k]=i;
  const el=document.getElementById('q'+k);
  el.querySelectorAll('.opt').forEach((b,j)=>b.classList.toggle('sel',j===i));
  renderBar();
}
let ZH = load('toeic_zh',false);
function syncZhBtn(){const b=document.getElementById('zhTop');b.textContent='中文：'+(ZH?'開':'關');b.classList.toggle('on',ZH)}
function toggleAllZh(){
  ZH=!ZH; save('toeic_zh',ZH); if(S) S.zh=ZH;
  document.querySelectorAll('.zhbox,.oz').forEach(e=>e.style.display=ZH?'block':'none');
  syncZhBtn(); if(S&&$bar.innerHTML) renderBar();
}
function renderBar(){
  const keys=allKeys(), n=keys.filter(k=>S.ans[k]!==undefined).length;
  let h=`<div class="bar"><div class="wrap">
    `;
  if(S.mode==='browse'){
    h+=`<span class="muted">${keys.length} 題</span><button class="btn" style="margin-left:auto" onclick="go('review')">返回</button>`;
  }else if(!S.done){
    h+=`<span class="muted">已作答 ${n}/${keys.length}</span>
      <button class="btn primary" style="margin-left:auto" onclick="submitQuiz()">交卷</button>`;
  }else{
    const wrongKeys=keys.filter(k=>S.ans[k]!==QMAP[k].q.a);
    h+=`<label class="muted"><input type="checkbox" id="onlyWrong" onchange="filterWrong(this.checked)"> 只看錯題</label>
      ${wrongKeys.length?`<button class="btn" onclick="startKeys('重做本次錯題',${JSON.stringify(wrongKeys).replace(/"/g,'&quot;')},'exam')">重做本次錯題</button>`:''}
      <button class="btn primary" style="margin-left:auto" onclick="go('home')">回首頁</button>`;
  }
  h+='</div></div>';
  $bar.innerHTML=h;
}
function filterWrong(on){
  allKeys().forEach(k=>{const el=document.getElementById('q'+k); if(el) el.style.display=(on&&S.ans[k]===QMAP[k].q.a)?'none':''});
  document.querySelectorAll('.qset').forEach(g=>{
    const vis=[...g.querySelectorAll('.q')].some(q=>q.style.display!=='none'); g.style.display=vis?'':'none';
  });
}
function submitQuiz(){
  const keys=allKeys(), un=keys.filter(k=>S.ans[k]===undefined).length;
  if(un && !confirm(`還有 ${un} 題沒作答，確定交卷？`)) return;
  S.done=true;
  let c=0;
  keys.forEach(k=>{ if(S.ans[k]===QMAP[k].q.a) c++; });
  const sec=Math.round((Date.now()-S.start)/1000);
  HIST.unshift({label:S.label,c,t:keys.length,time:Date.now(),sec,wrong:keys.filter(k=>S.ans[k]!==QMAP[k].q.a)});
  HIST=HIST.slice(0,200); save('toeic_hist',HIST);
  if(S.bestKey){const b=BEST[S.bestKey]; if(!b||c>b.c){BEST[S.bestKey]={c,t:keys.length};save('toeic_best',BEST)}}
  S.result={c,t:keys.length,sec};
  renderQuiz(); window.scrollTo(0,0);
}
function resultSummary(){
  const {c,t,sec}=S.result, keys=allKeys(), pct=Math.round(c/t*100);
  let parts={};
  keys.forEach(k=>{const p=QMAP[k].set.part;parts[p]=parts[p]||[0,0];parts[p][1]++;if(S.ans[k]===QMAP[k].q.a)parts[p][0]++});
  let h=`<div class="card"><div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap">
    <div><div class="score" style="color:${pct>=80?'var(--ok)':pct>=60?'var(--accent)':'var(--bad)'}">${c}<span style="font-size:22px" class="muted"> / ${t}</span></div>
    <div class="muted">正確率 ${pct}%　用時 ${Math.floor(sec/60)} 分 ${sec%60} 秒</div></div>
    <div>${Object.entries(parts).map(([p,[a,b]])=>`<div>Part ${p}：${a}/${b}</div>`).join('')}</div></div>
    <div class="muted" style="margin-top:10px">錯題解析就在下方每一題（紅色＝你的答案，綠色＝正解）。點下面的號碼可以跳到該題：</div>
    <div class="dots">${keys.map(k=>{const q=QMAP[k].q,ok=S.ans[k]===q.a;return `<span class="dot ${ok?'ok':'bad'}" onclick="document.getElementById('q${k}').scrollIntoView({behavior:'smooth',block:'center'})">${q.n}</span>`}).join('')}</div>
  </div>`;
  const wrongKeys=keys.filter(k=>S.ans[k]!==QMAP[k].q.a);
  if(wrongKeys.length){
    h+=`<div class="card"><h3>❌ 錯題解析（${wrongKeys.length} 題）</h3>`;
    wrongKeys.forEach(k=>{
      const {q,test}=QMAP[k], my=S.ans[k];
      h+=`<div class="q"><div><span class="qnum">${test.name} Q${q.n}</span>　${/^Question \d+$/.test(q.q)?'<span class="muted">（段落填空）</span>':esc(q.q)}</div>
        <div style="margin-top:4px">你的答案：<b style="color:var(--bad)">${my===undefined?'未作答':'('+L[my]+') '+esc(q.o[my])}</b>${my!==undefined&&q.oz?` <span class="muted">${esc(q.oz[my])}</span>`:''}</div>
        <div>正確答案：<b style="color:var(--ok)">(${L[q.a]}) ${esc(q.o[q.a])}</b>${q.oz?` <span class="muted">${esc(q.oz[q.a])}</span>`:''}</div>
        ${q.qz?`<div class="zhbox" style="display:block">${esc(q.qz)}</div>`:''}
        <div class="ex"><b>為什麼：</b>${esc(q.ex)}</div></div>`;
    });
    h+='</div>';
  }else h+=`<div class="card">🎉 全對！</div>`;
  h+=`<h2 style="margin-top:20px">完整題目與解析</h2>`;
  return h;
}

/* ---------- review ---------- */
function renderReview(){
  let h=`<h2>複習</h2><div class="grid">
    <div class="card"><h3>🎲 隨機抽題</h3><p class="muted">從所有考古題中隨機抽題，檢查記得多少。</p>
      <button class="btn" onclick="randomQuiz(20,null)">隨機 20 題</button>
      <button class="btn" onclick="randomQuiz(30,5)">Part 5 隨機 30 題</button></div>
    <div class="card"><h3>👀 瀏覽模式（看答案＋解析）</h3><p class="muted">考前快速掃過整份題目和正解。</p>
      ${TESTS_.map(t=>`<button class="btn" style="margin:2px" onclick="browseTest(${t.id})">${t.name}</button>`).join('')}</div>
  </div>`;
  $app.innerHTML=h;
}
function randomQuiz(n,part){
  let ks=Object.keys(QMAP).filter(k=>part==null||QMAP[k].set.part===part);
  // for passage questions, pull the whole set so the passage makes sense
  ks=ks.sort(()=>Math.random()-.5);
  const pick=[]; const seen=new Set();
  for(const k of ks){
    if(pick.length>=n) break;
    const m=QMAP[k];
    if(m.set.passage){const sk=m.test.id+':'+m.si; if(seen.has(sk)) continue; seen.add(sk); m.set.qs.forEach(q=>pick.push(qkey(m.test.id,q.n)));}
    else pick.push(k);
  }
  startKeys(`隨機抽題（${pick.length} 題）`, pick, 'exam');
}
function browseTest(id){const t=T(id);begin(`${t.name}｜瀏覽模式`, t.sets.map((s,si)=>({test:t,si,qns:s.qs.map(q=>q.n)})), 'browse', null)}

/* ---------- history ---------- */
function renderHistory(){
  let h=`<h2>練習紀錄</h2>`;
  if(!HIST.length){$app.innerHTML=h+'<p class="muted">還沒有紀錄。</p>';return}
  h+='<div class="card">';
  HIST.forEach((r,i)=>{
    const pct=Math.round(r.c/r.t*100), d=new Date(r.time);
    h+=`<div class="setrow"><span class="tag" style="min-width:110px">${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</span>
      <span class="t">${esc(r.label)}</span><span class="badge ${pct===100?'ok':pct<70?'bad':''}">${r.c}/${r.t}</span>
      ${r.wrong&&r.wrong.length?`<button class="btn small" onclick="startKeys('重做：${esc(r.label).replace(/'/g,'')}',HIST[${i}].wrong,'exam')">重做錯題</button>`:''}</div>`;
  });
  h+=`</div><button class="btn" onclick="if(confirm('清除所有紀錄？')){HIST=[];BEST={};save('toeic_hist',HIST);save('toeic_best',BEST);renderHistory()}">清除紀錄</button>`;
  $app.innerHTML=h;
}

syncZhBtn();
go('home');
</script>
</body>
</html>
